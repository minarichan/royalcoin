name: Slither

on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: crytic/slither-action@v0.4.0
        with:
          target: .
          slither-args: --filter-paths "lib|test|script"
          fail-on: medium